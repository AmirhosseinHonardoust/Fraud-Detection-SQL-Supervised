name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (black)
        run: black --check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Tests (with coverage, min 90%)
        run: pytest -q

      - name: Run pipeline end-to-end
        run: |
          python src/create_db.py --csv data/transactions_labeled.csv --db fraud.db
          python src/train_supervised.py --db fraud.db --sql src/queries.sql --outdir outputs

      - name: Upload pipeline outputs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: outputs/
