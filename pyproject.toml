[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-sql-supervised"
version = "0.1.0"
description = "SQL feature engineering + supervised (Logistic Regression) fraud detection pipeline"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.2",
    "matplotlib==3.10.8",
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
    "numpy==2.4.6",
]

[project.scripts]
fraud-create-db = "create_db:main"
fraud-train = "train_supervised:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["create_db", "train_supervised", "utils"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
